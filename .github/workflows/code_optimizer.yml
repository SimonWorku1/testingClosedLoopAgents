name: Code Optimizer (count_unique)

on:
  workflow_dispatch:
    inputs:
      max_iterations:
        description: "Max optimization iterations (default 10)"
        required: false
        default: "10"
        type: string

permissions:
  contents: write

jobs:
  optimize:
    name: "Optimize count_unique (${{ github.event.inputs.max_iterations }} iterations)"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: five

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run optimizer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          MAX_ITERATIONS: ${{ github.event.inputs.max_iterations }}
        run: python run_agent.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimizer-results
          path: results/
          retention-days: 90

      - name: Write job summary
        if: always()
        run: |
          echo "## count_unique Optimizer Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f results/iterations.jsonl ]; then
            echo "### Iteration Log" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat results/iterations.jsonl >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f results/best_candidate.py ]; then
            echo "### Best Candidate" >> $GITHUB_STEP_SUMMARY
            echo '```python' >> $GITHUB_STEP_SUMMARY
            cat results/best_candidate.py >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
