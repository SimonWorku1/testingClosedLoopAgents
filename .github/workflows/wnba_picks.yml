name: WNBA Prop Picks Optimizer

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: "Run name (e.g. 'season2024', 'test1'). Each gets its own isolated state."
        required: true
        type: string
      players:
        description: "Comma-separated player name substrings. '*' = all top players."
        required: false
        default: "*"
        type: string
      stats:
        description: "Comma-separated stat keys to include (e.g. 'AST' or 'AST,PRA'). Empty = all stats."
        required: false
        default: "AST"
        type: string
      top_players:
        description: "Limit to top N players by minutes (e.g. 20 for a faster run). Empty = all."
        required: false
        default: "20"
        type: string
      fresh_start:
        description: "Wipe existing state for this run and start from scratch."
        required: false
        default: "false"
        type: string
      attempt:
        description: "Attempt number (set automatically on auto-resume — do not fill in)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write   # push checkpoints to picks-state branch
  actions: write    # re-dispatch on crash for auto-resume

env:
  STATE_BRANCH: picks-state
  MAX_ATTEMPTS: 5

jobs:
  optimize:
    name: "${{ github.event.inputs.run_name }} (attempt ${{ github.event.inputs.attempt }})"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # One run per name at a time — never two VMs writing the same state.
    concurrency:
      group: wnba-picks-${{ github.event.inputs.run_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: four
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Picks Optimizer Bot"

      # Mount the picks-state branch as a worktree. Each run_name gets its
      # own subdirectory so multiple runs never collide.
      - name: Prepare state worktree
        run: |
          STATE_ROOT="${{ github.workspace }}/state-data"
          RUN_DIR="$STATE_ROOT/runs/${{ github.event.inputs.run_name }}"

          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$STATE_BRANCH"
            git worktree add "$STATE_ROOT" "origin/$STATE_BRANCH"
            git -C "$STATE_ROOT" checkout -B "$STATE_BRANCH" "origin/$STATE_BRANCH"
          else
            echo "No state branch yet — creating it."
            git worktree add --detach "$STATE_ROOT" HEAD
            git -C "$STATE_ROOT" checkout --orphan "$STATE_BRANCH"
            git -C "$STATE_ROOT" rm -rf . >/dev/null 2>&1 || true
          fi

          if [ "${{ github.event.inputs.fresh_start }}" = "true" ] && [ -d "$RUN_DIR" ]; then
            echo "fresh_start=true — wiping $RUN_DIR"
            rm -rf "$RUN_DIR"
          fi

          mkdir -p "$RUN_DIR/data"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Run picks optimizer
        id: optimizer
        working-directory: agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          STATS: ${{ github.event.inputs.stats }}
          TOP_PLAYERS: ${{ github.event.inputs.top_players }}
        run: |
          RUN_DIR="${{ github.workspace }}/state-data/runs/${{ github.event.inputs.run_name }}"
          python main.py "$RUN_DIR" \
            --data-dir "$RUN_DIR/data" \
            --state-file "$RUN_DIR/state.json" \
            --git-checkpoint "${{ github.workspace }}/state-data" \
            --players "${{ github.event.inputs.players }}" \
            ${STATS:+--stats "$STATS"} \
            ${TOP_PLAYERS:+--top-players "$TOP_PLAYERS"}

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "${{ github.event.inputs.run_name }}-results"
          path: "state-data/runs/${{ github.event.inputs.run_name }}/"
          retention-days: 90

      - name: Write job summary
        if: always()
        run: |
          RUN_DIR="${{ github.workspace }}/state-data/runs/${{ github.event.inputs.run_name }}"
          echo "## ${{ github.event.inputs.run_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "$RUN_DIR/picks_log.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -200 "$RUN_DIR/picks_log.txt" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No picks log produced." >> $GITHUB_STEP_SUMMARY
          fi

      # Auto-resume ONLY on a real crash (VM failure, API outage, etc).
      # main.py exits 0 on both success and "failed to reach target", so
      # this step never fires past the question budget.
      - name: Auto-resume on crash
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const attempt = parseInt('${{ github.event.inputs.attempt }}') || 1;
            const maxAttempts = parseInt('${{ env.MAX_ATTEMPTS }}') || 5;
            if (attempt >= maxAttempts) {
              console.log(`Reached MAX_ATTEMPTS (${maxAttempts}); not resuming.`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'wnba_picks.yml',
              ref: 'main',
              inputs: {
                run_name: '${{ github.event.inputs.run_name }}',
                players: '${{ github.event.inputs.players }}',
                stats: '${{ github.event.inputs.stats }}',
                top_players: '${{ github.event.inputs.top_players }}',
                fresh_start: 'false',
                attempt: String(attempt + 1),
              },
            });
            console.log(`Attempt ${attempt} crashed — resuming as attempt ${attempt + 1}.`);
