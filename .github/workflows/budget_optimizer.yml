name: Ad Budget Optimizer

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "Campaign name (e.g. 'acme', 'globex'). Each name gets its own isolated history."
        required: true
        type: string
      fresh_start:
        description: "Wipe existing history for this campaign and start from scratch."
        required: false
        default: "false"
        type: string
      attempt:
        description: "Attempt number (set automatically on auto-resume — do not fill in)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write   # push checkpoints to the budget-state branch
  actions: write    # re-dispatch this workflow to auto-resume on failure

env:
  STATE_BRANCH: budget-state
  MAX_ATTEMPTS: 5

jobs:
  optimize:
    name: "${{ github.event.inputs.campaign }} (attempt ${{ github.event.inputs.attempt }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run per campaign at a time — never two VMs writing the same state.
    concurrency:
      group: budget-optimizer-${{ github.event.inputs.campaign }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: two
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Budget Optimizer Bot"

      # Mount the budget-state branch as a worktree. Each campaign lives in
      # its own subdirectory, so multiple companies never touch each other's files.
      - name: Prepare state worktree
        run: |
          STATE_ROOT="${{ github.workspace }}/state-data"
          CAMPAIGN_DIR="$STATE_ROOT/campaigns/${{ github.event.inputs.campaign }}"

          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$STATE_BRANCH"
            git worktree add "$STATE_ROOT" "origin/$STATE_BRANCH"
            git -C "$STATE_ROOT" checkout -B "$STATE_BRANCH" "origin/$STATE_BRANCH"
          else
            echo "No state branch yet — creating it."
            git worktree add --detach "$STATE_ROOT" HEAD
            git -C "$STATE_ROOT" checkout --orphan "$STATE_BRANCH"
            git -C "$STATE_ROOT" rm -rf . >/dev/null 2>&1 || true
          fi

          # Fresh start: wipe this campaign's directory if requested.
          if [ "${{ github.event.inputs.fresh_start }}" = "true" ] && [ -d "$CAMPAIGN_DIR" ]; then
            echo "fresh_start=true — wiping $CAMPAIGN_DIR"
            rm -rf "$CAMPAIGN_DIR"
          fi

          mkdir -p "$CAMPAIGN_DIR"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Run optimizer
        id: optimizer
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          CAMPAIGN_DIR="${{ github.workspace }}/state-data/campaigns/${{ github.event.inputs.campaign }}"
          python main.py "$CAMPAIGN_DIR" \
            --state-file "$CAMPAIGN_DIR/state.json" \
            --git-checkpoint "${{ github.workspace }}/state-data"

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "${{ github.event.inputs.campaign }}-results"
          path: "state-data/campaigns/${{ github.event.inputs.campaign }}/"
          retention-days: 90

      - name: Write job summary
        if: always()
        run: |
          CAMPAIGN_DIR="${{ github.workspace }}/state-data/campaigns/${{ github.event.inputs.campaign }}"
          echo "## ${{ github.event.inputs.campaign }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "$CAMPAIGN_DIR/daily_log.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat "$CAMPAIGN_DIR/daily_log.txt" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No daily log produced." >> $GITHUB_STEP_SUMMARY
          fi

      # On failure: auto-resume up to MAX_ATTEMPTS, passing campaign + attempt forward.
      - name: Auto-resume on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const attempt = parseInt('${{ github.event.inputs.attempt }}') || 1;
            const maxAttempts = parseInt('${{ env.MAX_ATTEMPTS }}') || 5;
            if (attempt >= maxAttempts) {
              console.log(`Reached MAX_ATTEMPTS (${maxAttempts}); not resuming.`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'budget_optimizer.yml',
              ref: 'main',
              inputs: {
                campaign: '${{ github.event.inputs.campaign }}',
                fresh_start: 'false',
                attempt: String(attempt + 1),
              },
            });
            console.log(`Attempt ${attempt} failed — resuming as attempt ${attempt + 1}.`);
