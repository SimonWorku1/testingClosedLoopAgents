name: Ad Budget Optimizer

on:
  workflow_dispatch:
    inputs:
      attempt:
        description: "Attempt number (set automatically on auto-resume)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write   # push checkpoints to the budget-state branch
  actions: write    # re-dispatch this workflow to auto-resume on failure

env:
  CODE_BRANCH: two
  STATE_BRANCH: budget-state
  MAX_ATTEMPTS: 5

jobs:
  optimize:
    name: "Ad Budget Optimizer (attempt ${{ github.event.inputs.attempt }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Serialize: never let two runs touch the state branch at once
    concurrency:
      group: budget-optimizer
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: two
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Budget Optimizer Bot"

      # Set up a worktree on the state branch. This is the durable checkpoint
      # store: state.json is committed+pushed here after every day, so a VM
      # crash loses at most the in-progress day.
      - name: Prepare state worktree
        run: |
          STATE_DIR="${{ github.workspace }}/state-data"
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            echo "Resuming from existing state branch."
            git fetch origin "$STATE_BRANCH"
            git worktree add "$STATE_DIR" "origin/$STATE_BRANCH"
            git -C "$STATE_DIR" checkout -B "$STATE_BRANCH" "origin/$STATE_BRANCH"
          else
            echo "No state branch yet — starting a fresh campaign."
            git worktree add --detach "$STATE_DIR" HEAD
            git -C "$STATE_DIR" checkout --orphan "$STATE_BRANCH"
            git -C "$STATE_DIR" rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Run optimizer (resumes from last checkpoint)
        id: optimizer
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          STATE_DIR="${{ github.workspace }}/state-data"
          python main.py "$STATE_DIR" \
            --state-file "$STATE_DIR/state.json" \
            --git-checkpoint "$STATE_DIR"

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-optimizer-results
          path: state-data/
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          STATE_DIR="${{ github.workspace }}/state-data"
          echo "## Ad Budget Optimizer" >> $GITHUB_STEP_SUMMARY
          if [ -f "$STATE_DIR/daily_log.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat "$STATE_DIR/daily_log.txt" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No daily log produced." >> $GITHUB_STEP_SUMMARY
          fi

      # If the job failed, automatically re-dispatch to resume from the last
      # checkpoint — capped at MAX_ATTEMPTS so a deterministic bug can't loop.
      - name: Auto-resume on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const attempt = parseInt('${{ github.event.inputs.attempt }}') || 1;
            const maxAttempts = parseInt('${{ env.MAX_ATTEMPTS }}') || 5;
            if (attempt >= maxAttempts) {
              console.log(`Reached MAX_ATTEMPTS (${maxAttempts}); not resuming.`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'budget_optimizer.yml',
              ref: 'main',
              inputs: { attempt: String(attempt + 1) },
            });
            console.log(`Failure on attempt ${attempt} — dispatched attempt ${attempt + 1}.`);
