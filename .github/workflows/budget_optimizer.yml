name: Ad Budget Optimizer

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  optimize:
    name: Run Budget Optimization Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Run optimizer
        id: optimizer
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimization-results
          path: agent/outputs/
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          SIGN_UPS="${{ steps.optimizer.outputs.total_sign_ups }}"
          DAYS="${{ steps.optimizer.outputs.days_run }}"
          echo "## Ad Budget Optimizer Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total sign-ups | ${SIGN_UPS} |" >> $GITHUB_STEP_SUMMARY
          echo "| Days run | ${DAYS} |" >> $GITHUB_STEP_SUMMARY
