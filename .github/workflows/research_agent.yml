name: Autonomous Research Agent

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Research topic to investigate"
        required: true
        type: string
      output_dir:
        description: "Output directory for reports (default: outputs)"
        required: false
        default: "outputs"
        type: string

jobs:
  research:
    name: "Research: ${{ github.event.inputs.topic }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Run research agent
        id: research
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python main.py \
            "${{ github.event.inputs.topic }}" \
            "../${{ github.event.inputs.output_dir }}"

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-reports-${{ github.run_id }}
          path: ${{ github.event.inputs.output_dir }}/
          retention-days: 30

      - name: Show best report in summary
        if: always()
        run: |
          SUMMARY_FILE="${{ github.event.inputs.output_dir }}/run_summary.json"
          if [ -f "$SUMMARY_FILE" ]; then
            SCORE=$(jq -r '.best_score' "$SUMMARY_FILE")
            ITERS=$(jq -r '.iterations_run' "$SUMMARY_FILE")
            REPORT=$(jq -r '.best_report_path' "$SUMMARY_FILE")

            echo "## Research Agent Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Topic | ${{ github.event.inputs.topic }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Best Score | ${SCORE}/10 |" >> $GITHUB_STEP_SUMMARY
            echo "| Iterations Run | ${ITERS} |" >> $GITHUB_STEP_SUMMARY
            echo "| Agents per Iteration | 3 |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ -f "$REPORT" ]; then
              echo "### Best Report" >> $GITHUB_STEP_SUMMARY
              cat "$REPORT" >> $GITHUB_STEP_SUMMARY
            fi
          fi
