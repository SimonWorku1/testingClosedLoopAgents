name: Autonomous Research Agent

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Research topic to investigate"
        required: true
        type: string
      iteration:
        description: "Current iteration number (0-indexed, set automatically)"
        required: false
        default: "0"
        type: string
      run_id:
        description: "Shared run ID to group artifacts (set automatically)"
        required: false
        default: ""
        type: string
      prev_run_id:
        description: "GitHub run ID of the previous iteration, for artifact download (set automatically)"
        required: false
        default: ""
        type: string
      max_iterations:
        description: "Maximum number of improvement iterations"
        required: false
        default: "5"
        type: string

permissions:
  actions: write   # needed to trigger the next iteration

jobs:
  research:
    name: "Iteration ${{ github.event.inputs.iteration }} — ${{ github.event.inputs.topic }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      # On iterations > 0, download the history artifact from the previous iteration's run.
      # We must supply run-id because download-artifact@v4 only searches the current run by default.
      - name: Download history from previous iterations
        if: ${{ github.event.inputs.iteration != '0' }}
        uses: actions/download-artifact@v4
        with:
          name: research-history-${{ github.event.inputs.run_id }}
          run-id: ${{ github.event.inputs.prev_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/

      - name: Run research iteration
        id: research
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python main.py \
            "${{ github.event.inputs.topic }}" \
            "../outputs" \
            --iteration ${{ github.event.inputs.iteration }} \
            --history-file ../outputs/history.json

      - name: Upload history artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # Always upload under the shared run_id so next iteration can find it.
          # Use github.run_id as the shared key on iteration 0.
          name: research-history-${{ github.event.inputs.run_id || github.run_id }}
          path: outputs/
          overwrite: true
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          SCORE="${{ steps.research.outputs.score }}"
          DONE="${{ steps.research.outputs.done }}"
          ITER="${{ github.event.inputs.iteration }}"
          echo "## Iteration $((ITER + 1)) — Score: ${SCORE}/10" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$DONE" = "true" ]; then
            echo "**Target score reached!**" >> $GITHUB_STEP_SUMMARY
          fi
          REPORT=$(ls outputs/iteration_*.md 2>/dev/null | tail -1)
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> $GITHUB_STEP_SUMMARY
          fi

      # Trigger next iteration if score not yet reached and iterations remain
      - name: Trigger next iteration
        if: steps.research.outputs.done == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const iteration = parseInt('${{ github.event.inputs.iteration }}');
            const maxIterations = parseInt('${{ github.event.inputs.max_iterations }}');
            const nextIteration = iteration + 1;
            if (nextIteration >= maxIterations) {
              console.log(`Reached max iterations (${maxIterations}), stopping.`);
              return;
            }
            const runId = '${{ github.event.inputs.run_id }}' || '${{ github.run_id }}';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'research_agent.yml',
              ref: 'main',
              inputs: {
                topic: '${{ github.event.inputs.topic }}',
                iteration: String(nextIteration),
                run_id: runId,
                prev_run_id: '${{ github.run_id }}',
                max_iterations: '${{ github.event.inputs.max_iterations }}',
              }
            });
            console.log(`Triggered iteration ${nextIteration} (run_id: ${runId})`);
